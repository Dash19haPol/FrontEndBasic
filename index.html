<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/reset.css">
</head>

<body>
    <img src="images\X.svg" alt="exit" alt="Иконка">
    <form action="/submit" method="post" align="center">
        <p>
            <span>Login</span>
            <span>&nbsp;|&nbsp;</span>
            <span class="greentext">Register</span>
        </p>
        
        <lable for="">
            <p>Enter your email and password to register.</p>
            <input type="text" placeholder="Username">
        </lable>

        <label for="">
            <input type="email" placeholder="Enter your email address">
        </label>

        <div class="hide">
            <input type="password" placeholder="Password">
            <img src="images\Hide.svg" alt="Hide icon" width="13px">
        </div>

        <label for="">
            <input type="password" placeholder="Confirm Password">
        </label>
        
        <label for="">
            <input class="btn" type="button" value="Register">
        </label>

        <div class="text">
            <hr noshade>
            <span>Or register with</span>
            <hr noshade>
        </div>

        <label for="">
            <button>
                <img src="images\google.svg" alt="Google icon" width="13px">
                Continue with Google
            </button>
        </label>

        <label for="">
            <button>
                <img src="images\facebook.svg" alt="Facebook icon" width="13px">
                Continue with Facebook
            </button>
        </label>
        
    </form>

    <section></section>

</body>
</html>
