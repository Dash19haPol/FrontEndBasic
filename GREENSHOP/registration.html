<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <img src="C:\Polovneva Daria\img\X.svg" alt="exit" alt="Иконка" style="
    position: fixed;
    top: 10px;
    right: 10px;
    width: 20px;
    ">
    <form action="/submit" method="post" align="center" style="display: flex; flex-direction: column; gap: 15px;">
        <p>
            <span style="font-size: 20px; color: #3D3D3D;">Login</span>
            <span style="font-size: 18px; color: #3D3D3D;">&nbsp;|&nbsp;</span>
            <span style="font-size: 20px; color: #46A358;">Register</span>
        </p>
        
        <lable for="">
            <p style="color: #3D3D3D;">Enter your email and password to register.</p>
            <input type="text" style="
            width: 300px;
            height: 40px;
            border-radius: 5px;
            border: 1px solid #EAEAEA;"
            placeholder="Username">
        </lable>

        <label for="">
            <input type="email" style="
            width: 300px;
            height: 40px;
            border-radius: 5px;
            border: 1px solid #EAEAEA;"
            placeholder="Enter your email address">
        </label>

        <div style="position: relative;">
            <input type="password" style="
            width: 300px;
            height: 40px;
            border-radius: 5px;
            border: 1px solid #EAEAEA;"
            placeholder="Password">
            <img src="C:\Polovneva Daria\img\Hide.svg" alt="Hide icon" width="13px">
        </div>

        <label for="">
            <input type="password" style="
            width: 300px;
            height: 40px;
            border-radius: 5px;
            border: 1px solid #EAEAEA;"
            placeholder="Confirm Password">
        </label>
        
        <label for="">
            <input type="button" style="
            background:#46A358;
            border:1px solid #46A358;
            color: #fff;
            font-size: 16px;
            border-radius: 5px;
            width: 300px;
            height: 45px;"
            value="Register">
        </label>

        <div style="
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: center;
        ">
            <hr style="flex: 1; width:97px; height: 1px; color: #EAEAEA;" noshade>
            <span style="color: #3D3D3D;">Or register with</span>
            <hr style="flex: 1; width:97px; height: 1px; color: #EAEAEA;" noshade>
        </div>

        <label for="">
            <button style="
                background: #FFF;
                border:1px solid #EAEAEA;
                border-radius: 5px;
                width: 300px;
                height: 40px;">
                <img src="C:\Polovneva Daria\img\google.svg" alt="Google icon" width="13px">
                Continue with Google
            </button>
        </label>

        <label for="">
            <button style="
            background: #FFF;
            border:1px solid #EAEAEA;
            border-radius: 5px;
            width: 300px;
            height: 40px;">
                <img src="C:\Polovneva Daria\img\facebook.svg" alt="Facebook icon" width="13px">
                Continue with Facebook
            </button>
        </label>
        
    </form>

    <section style="
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #46A358;
    text-align: center;
    padding: 10px;
    ">
    </section>

</body>
</html>
